# Select explicitly on the existing Site-Web service. Repository root must be /.
# This separate configuration does not repoint or deploy a service by itself.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.staging"
watchPatterns = ["Dockerfile.staging", "Dockerfile.staging.dockerignore", "railway.staging.toml", "apps/site-api/src/staging/**", "apps/site-api/src/workspace/**", "apps/site-api/src/calculation/**", "apps/site-api/src/lib/auth.ts", "apps/site-api/src/lib/origin-check.ts", "apps/site-api/src/lib/rate-limit.ts", "apps/site-web/**", "apps/*/package.json", "packages/neuvetra-database/**", "packages/*/package.json", "data/synthetic/m58-electricity-register-2023*", "data/research/answer-units/scope2-website.epa-acquisition.v1.json", "output/pdf/neuvetra-m55-synthetic-electricity-bill.pdf", "tools/cloud/fixtures/supabase-prod-ca-2021.crt", "package.json", "bun.lock", "tsconfig.base.json", "config/typescript/**"]

[deploy]
startCommand = "bun run apps/site-api/src/staging/server.ts"
healthcheckPath = "/ready"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
