# Service Root Directory must be /; config path is /apps/frontdesk-web/railway.toml.
# Legacy Railway config; migration status is recorded in docs/deployment.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/frontdesk-web/Dockerfile"
watchPatterns = ["apps/frontdesk-web/**", "apps/*/package.json", "packages/*/package.json", "package.json", "bun.lock", "tsconfig.base.json", "config/**", ".dockerignore"]

[deploy]
startCommand = "bun run --bun serve -s dist -l tcp://0.0.0.0:8080 --no-clipboard --no-port-switching"
healthcheckPath = "/"
healthcheckTimeout = 120
