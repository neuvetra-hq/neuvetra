name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  native-postgres:
    name: Native PostgreSQL worksheet and tenant regression
    runs-on: ubuntu-latest
    # Round 3 (EN-8): raised from 15. The staged step now holds the line-cap fixtures (3,000 worst-case records, saved one by
    # one through the collection RPC: 50-120 s each) and round 3's memory-budget test (prepare, approve, open, re-prepare at
    # the cap); measured about 6-8 min for that step on a 2-CPU host.
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: m63_test_admin
          POSTGRES_DB: m63_integration
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55463:5432
        options: >-
          --health-cmd "pg_isready -U m63_test_admin -d m63_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      beta-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55472:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Initialize and challenge isolated PostgreSQL roles and storage
        run: bun test packages/neuvetra-database/src/hosted.test.ts
        env:
          M63_TEST_DATABASE_URL: postgres://m63_test_admin@127.0.0.1:55463/m63_integration
      - name: Verify staged HTTP and frontend decoding against PostgreSQL
        run: bun test apps/site-api/src/staging/postgres.test.ts apps/site-api/src/workspace/m66-postgres.test.ts apps/site-api/src/workspace/m67-postgres.test.ts apps/site-api/src/workspace/m68-postgres.test.ts apps/site-api/src/workspace/m71-postgres.test.ts
        env:
          M63_API_TEST_DATABASE_URL: postgres://m63_test_admin@127.0.0.1:55463/m63_integration
          M71_API_TEST_DATABASE_URL: postgres://m63_test_admin@127.0.0.1:55463/m63_integration
      - name: Prepare isolated stationary natural-gas native fixture
        run: bun tools/staging/m73-backend-fixture.ts m73_author_ci --ci-baseline=m63_integration
      - name: Verify stationary natural-gas storage, calculation, reports and browser decoder
        run: bun test apps/site-api/src/workspace/m73-postgres.test.ts
        env:
          M73_TEST_DATABASE_URL: postgres://m63_test_admin@127.0.0.1:55463/m73_author_ci
      - name: Prepare isolated mobile-diesel native fixture
        run: bun tools/staging/m74-backend-fixture.ts m74_author_ci --ci-baseline=m63_integration
      - name: Verify mobile-diesel storage, two-evidence calculation, reports and browser decoder
        run: bun test apps/site-api/src/workspace/m74-postgres.test.ts apps/site-api/src/calculation/m74-authority.test.ts
        env:
          M74_TEST_DATABASE_URL: postgres://m63_test_admin@127.0.0.1:55463/m74_author_ci
      - name: Independently verify mobile-diesel accounting against frozen source oracle
        run: bun test evaluations/research-qa/m74-independent-accounting-native.test.ts
        env:
          M74_ACCOUNTING_TEMPLATE_DATABASE: m74_author_ci

      - name: Prepare isolated controlled-fleet native fixture
        run: bun tools/staging/m75-backend-fixture.ts m75_author_ci --ci-baseline=m63_integration
      - name: Verify controlled-fleet persistence, reconciliation and access boundaries
        run: bun test apps/site-api/src/workspace/m75-postgres.test.ts
        env:
          M75_TEST_DATABASE_URL: postgres://m63_test_admin@127.0.0.1:55463/m75_author_ci
      - name: Prepare isolated stationary equipment native fixture
        run: bun tools/staging/m76-backend-fixture.ts m76_author_ci --ci-baseline=m63_integration
      - name: Verify stationary equipment persistence, exact calculation and access boundaries
        run: bun test apps/site-api/src/workspace/m76-postgres.test.ts
        env:
          M76_TEST_DATABASE_URL: postgres://m63_test_admin@127.0.0.1:55463/m76_author_ci
      - name: Independently challenge stationary arithmetic and historical proof
        run: bun test evaluations/research-qa/m76-independent-native.test.ts
        env:
          M76_INDEPENDENT_NATIVE: enabled
          M76_QA_TEMPLATE: m76_author_ci
      - name: Independently challenge cross-family fuel evidence and retained capacity
        run: |
          bun test evaluations/research-qa/m76-independent-native-security.test.ts
          bun test evaluations/research-qa/m76-independent-native-capacity.test.ts
          bun test evaluations/research-qa/m76-independent-native-report-capacity.test.ts
        env:
          M76_INDEPENDENT_NATIVE: enabled

      - name: Verify fugitive workpaper lifecycle, physical population and retained evidence
        run: bun test apps/site-api/src/workspace/m77-postgres.test.ts
        env:
          NEUVETRA_M77_NATIVE: "1"
          NEUVETRA_M77_CI_BASELINE: "1"

      - name: Independently challenge fugitive evidence, contributors and preserved corporate bindings
        run: bun test evaluations/research-qa/m77-integrated-native.test.ts evaluations/research-qa/m77-binding-native.test.ts
        env:
          NEUVETRA_M77_QA_NATIVE: "1"
          NEUVETRA_M77_CI_BASELINE: "1"

      - name: Independently verify Scope 1 blocked lifecycle and retained downloads
        run: bun test evaluations/research-qa/m80-ci-schema-regression.test.ts evaluations/research-qa/m78-ci-native.test.ts
        env:
          M78_QA_CI_BASELINE_URL: postgres://m63_test_admin@127.0.0.1:55463/m63_integration

      - name: Select PostgreSQL 17 backup and restore clients for beta access
        run: |
          . /etc/os-release
          test -n "${VERSION_CODENAME:-}"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --silent --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          printf '%s\n' \
            "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version | grep -E '^pg_dump \(PostgreSQL\) 17\.'
          /usr/lib/postgresql/17/bin/pg_restore --version | grep -E '^pg_restore \(PostgreSQL\) 17\.'

      - name: Exercise beta invitation access through native restricted PostgreSQL
        run: |
          bun tools/beta-access/ci-prerequisites.ts
          bun test apps/site-api/src/beta-access/auth.test.ts apps/site-api/src/beta-access/server.test.ts apps/site-api/src/beta-access/listener.test.ts apps/site-api/src/beta-access/postgres.test.ts
        env:
          M80_BETA_ACCESS_NATIVE: enabled
          M80_BETA_ACCESS_CI: enabled

      - name: Challenge Scope 1 concurrent writes and post-write rollback
        run: bun test evaluations/research-qa/m78-perf-concurrency.test.ts evaluations/research-qa/m78-perf-independent.test.ts
        env:
          M78_PERF_NATIVE_BASELINE_URL: postgres://m63_test_admin@127.0.0.1:55463/m63_integration

      - name: Independently challenge controlled-fleet native lifecycle and direct SQL admission
        run: |
          bun test evaluations/research-qa/m75-independent-native.test.ts
          bun run evaluations/research-qa/m75-independent-direct-sql.ts
          bun run evaluations/research-qa/m75-independent-sql-parity.ts
        env:
          M75_INDEPENDENT_NATIVE: enabled
          M75_QA_TEMPLATE: m63_integration

      - name: Exercise controlled-fleet publication journey against isolated local routes
        run: bun test tools/staging/check-m75-hosted.test.ts
        env:
          M75_HOSTED_NATIVE_SOURCE: m75_author_ci

      # Full-cap Scope 3 reports exceed the historical fixture copiers' single-jsonb limit.
      # Keep all stress data and assertions, but create the legacy fixtures before these reports.
      - name: Verify Scope 3 staged HTTP, frozen reports and full capacity against PostgreSQL
        run: bun test apps/site-api/src/staging/scope3-postgres.test.ts apps/site-api/src/staging/scope3-reports-postgres.test.ts apps/site-api/src/staging/scope3-round2-postgres.test.ts apps/site-api/src/staging/scope3-round3-postgres.test.ts
        env:
          M63_API_TEST_DATABASE_URL: postgres://m63_test_admin@127.0.0.1:55463/m63_integration

  applications:
    name: Typecheck, lint, unit tests and web builds
    runs-on: ubuntu-latest
    # Round 3 (EN-8): `bun run check` alone took about 11.5 min sequentially on a 2-CPU host (typecheck 73 s, database 276 s,
    # API 126 s, web 132 s, lint 48 s, build 35 s); the independent evaluation steps moved to `applications-evaluations`.
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run check

  applications-evaluations:
    # Round 3 (EN-8): split from `applications` (independent decoders, renderers and operator controls), so neither job runs
    # near its limit.
    name: Independent evaluations and operator controls
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Independent Scope 1 setup decoder and current read-only lifecycle
        run: bun test evaluations/research-qa/m80-setup-integration-independent-20260924-decoder.test.ts evaluations/research-qa/m80-setup-integration-independent-20260924-valid.test.ts evaluations/research-qa/m80-legacy-readonly-lifecycle.test.ts
      - name: Independent source-linked worksheet decoder and report cases
        run: bun test evaluations/research-qa/m66-independent-frontend.test.ts evaluations/research-qa/m66-independent-renderer.test.ts
      - name: Independent annual worksheet decoder, renderer and print-action cases
        run: bun test evaluations/research-qa/m67-independent-frontend.test.ts evaluations/research-qa/m67-independent-renderer.test.ts evaluations/research-qa/m67-independent-print-view.test.ts
      - name: Independent annual evidence decoder, UI, print-action and packaging cases
        run: bun test evaluations/research-qa/m68-independent-frontend.test.ts evaluations/research-qa/m68-independent-print-view.test.ts evaluations/research-qa/m68-independent-ui.test.ts
      - name: Independent corporate coverage validation, decoder and actor-lifetime cases
        run: bun test evaluations/research-qa/m71-qa-validation.test.ts evaluations/research-qa/m71-qa-frontend.test.ts evaluations/research-qa/m71-qa-ui.test.ts evaluations/research-qa/m71-security-frontend.test.ts evaluations/research-qa/m71-security-parser.test.ts
      - name: Stationary natural-gas operator admission and preservation controls
        run: bun test tools/staging/m73-operators.test.ts
      - name: Independent mobile-diesel frontend and hosted journey controls
        run: bun test evaluations/research-qa/m74-frontend-ui.test.ts evaluations/research-qa/m74-frontend-decoder.test.ts evaluations/research-qa/m74-frontend-version.test.ts evaluations/research-qa/m74-frontend-registration.test.ts tools/staging/check-m74-hosted.test.ts evaluations/research-qa/m74-hosted-helper-independent.test.ts tools/staging/m74-operators.test.ts evaluations/research-qa/m74-security-operator-gate.test.ts
      - name: Independent controlled-fleet reconciliation, reports and browser decoding
        run: bun test evaluations/research-qa/m75-independent-classification.test.ts evaluations/research-qa/m75-independent-renderer.test.ts evaluations/research-qa/m75-independent-decoder.test.ts tools/staging/m75-operators.test.ts tools/staging/check-m75-hosted.test.ts
      - name: Independent stationary equipment, generator arithmetic and historical reports
        run: bun test evaluations/research-qa/m76-independent-admission.test.ts evaluations/research-qa/m76-independent-authority.test.ts evaluations/research-qa/m76-independent-generator-decoder.test.ts evaluations/research-qa/m76-independent-reconciliation.test.ts evaluations/research-qa/m76-independent-renderer-decoder.test.ts evaluations/research-qa/m76-independent-report-duplicates.test.ts tools/staging/m76-operators.test.ts tools/staging/check-m76-hosted.test.ts
      - name: Additive stationary journey safety guards
        # The exact failed-state rehearsal is local and uses a private encrypted backup.
        # This guard suite runs without that journal, credentials or hosted access.
        run: bun test tools/staging/m76-hosted-recovery.test.ts
      - name: Explicit continuation journal guards
        run: bun test tools/staging/m76-hosted-continuation.test.ts
      - name: Fugitive recovery and hosted journal guards
        # Encrypted native recovery remains a separate Windows rehearsal.
        run: bun test tools/staging/check-m77-hosted.test.ts tools/staging/check-m77-continuation.test.ts evaluations/research-qa/m77-release-journal.test.ts evaluations/research-qa/m77-continuation-journal.test.ts
      - name: Independent Scope 1 browser decoding and recovery admission
        run: bun test evaluations/research-qa/m78-browser-independent.test.ts evaluations/research-qa/m78-capacity-browser.test.ts evaluations/research-qa/m78-hosted-plan-independent.test.ts tools/staging/check-m78-hosted.test.ts evaluations/research-qa/m78-resume-local-upgrade-independent.test.ts evaluations/research-qa/m78-resume-recipe-shapes.test.ts evaluations/research-qa/m78-resume-response-shape-independent.test.ts tools/staging/check-m78-continuation.test.ts tools/staging/m78-continuation-plan.test.ts tools/staging/m78-continuation-source-pins.test.ts evaluations/research-qa/m78-continuation-independent.test.ts evaluations/research-qa/m78-continuation-closure-independent.test.ts
      - name: Independent current continuation4 transport guards
        run: bun test evaluations/research-qa/m78-continuation4-independent.test.ts --test-name-pattern "^portable"
      - name: Scope 1 GET preservation and finite diagnostic guards
        run: bun test evaluations/research-qa/m78-get-local-comparison-independent.test.ts evaluations/research-qa/m78-get-historical-gates.test.ts
      - name: Current GET behavior independent of historical byte pins
        run: bun test evaluations/research-qa/m78-continuation4-get-perf-probe.test.ts evaluations/research-qa/m78-get-guard-independent.test.ts evaluations/research-qa/m78-get-local-comparison-independent-actual.test.ts --test-name-pattern "metadata,|authentication,|historical candidate1|the finite set|nested calls|historical result|actual frozen|actual evidence"
      - name: Continuation4 closed baseline evidence guards
        run: bun test evaluations/research-qa/m78-continuation4-baseline-review.test.ts
      - name: Continuation4 lifecycle and passive revisit guards
        run: bun test evaluations/research-qa/m78-continuation4-lifecycle-independent.test.ts tools/staging/m78-continuation4-revisit-capture.test.ts
      - name: Offline cloud database boundary tests
        run: bun test tools/cloud/database-inventory.test.ts tools/cloud/apply-development.test.ts tools/cloud/data-api-exposure.test.ts tools/cloud/activate-synthetic.test.ts tools/cloud/website-publication.test.ts tools/cloud/check-website-reader.test.ts tools/research/evaluate-website-cloud.test.ts tools/research/evaluate-website-composed.test.ts tools/research/cloud-read-diagnostics.test.ts tools/research/cloud-fetch-injection.test.ts
      - name: Typecheck cloud database helper
        run: bun node_modules/typescript/bin/tsc --noEmit --module esnext --moduleResolution bundler --target es2022 --types bun --strict --skipLibCheck tools/cloud/database-inventory.ts tools/cloud/database-inventory.test.ts tools/cloud/apply-development.ts tools/cloud/apply-development.test.ts tools/cloud/data-api-exposure.ts tools/cloud/data-api-exposure.test.ts tools/cloud/activate-synthetic.ts tools/cloud/activate-synthetic.test.ts tools/cloud/website-publication.ts tools/cloud/website-publication.test.ts tools/cloud/check-website-reader.ts tools/cloud/check-website-reader.test.ts tools/research/evaluate-website-cloud.ts tools/research/evaluate-website-cloud.test.ts tools/research/evaluate-website-composed.ts tools/research/evaluate-website-composed.test.ts tools/research/evaluate-website-questions.ts tools/research/cloud-read-diagnostics.ts tools/research/cloud-read-diagnostics.test.ts tools/research/cloud-fetch-injection.test.ts

  staging-image:
    name: Dedicated staging image and offline runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build explicit combined image without provider credentials
        run: docker build --platform linux/amd64 --file Dockerfile.staging --tag neuvetra-m63:${{ github.sha }} .
      - name: Verify runtime imports, pinned assets, Python and actual HTTP listener offline
        run: |
          docker run --rm --network none --entrypoint bun neuvetra-m63:${{ github.sha }} -e '
            import {createStagingServer} from "/app/apps/site-api/src/staging/server.ts";
            import {readStagingConfig,STAGING_PROFILE} from "/app/apps/site-api/src/staging/config.ts";
            import {runEngine} from "/app/apps/site-api/src/calculation/server.ts";
            const {readMigrationManifest}=await import("/app/packages/neuvetra-database/src/staging-migrations.ts");
            const manifest=await readMigrationManifest();if(manifest.length!==32||manifest[15].name!=="0016_stationary_natural_gas.sql"||manifest[16].name!=="0017_mobile_diesel.sql"||manifest[17].name!=="0018_controlled_fleet.sql"||manifest[18].name!=="0019_stationary_sources.sql"||manifest[19].name!=="0020_fugitive_sources.sql"||manifest[20].name!=="0021_scope1_inventory.sql"||manifest[21].name!=="0022_scope1_beta_foundation.sql"||manifest[22].name!=="0023_company_setup.sql"||manifest[23].name!=="0024_method_reference.sql"||manifest[24].name!=="0025_scope3_method_reference.sql"||manifest[25].name!=="0026_scope2_residual_mix.sql"||manifest[26].name!=="0027_collection.sql"||manifest[27].name!=="0028_collection_zip_check.sql"||manifest[27].sha256!=="5ae7da9aef3b0d9f5fe4cd679a200722d0603fd201597df67897eec57b212917"||manifest[28].name!=="0029_scope3_collection.sql"||manifest[28].sha256!=="f191ce06fd50edd8c65b7d3f6f659c6713392123a9ea8cba074e3f0c4954f0ad"||manifest[29].name!=="0030_scope3_completion.sql"||manifest[29].sha256!=="8aaec185c30443b0c4f8b2434f0fb4c3565d207c6bba5e1050319860d924105b"||manifest[30].name!=="0031_integrity_guards.sql"||manifest[30].sha256!=="3513b5da55e41133d94faaf3a8b610e1fb66f415a95393272d3f8b1c49246cd7"||manifest[31].name!=="0032_instrument_identity_and_bindings.sql"||manifest[31].sha256!=="1d9a2c5ee01f90f6c1fd6a56baebc92c2d1a70a1442db2a1ff00085a5555033f")throw new Error("Incomplete image migration manifest");
            const {STAGING_SCHEMA_VERSION,STAGING_SCHEMA_BRIDGE_VERSION,STAGING_SERVED_SCHEMA_VERSIONS,validateHostedSchemaReceipts}=await import("/app/packages/neuvetra-database/src/hosted.ts");if(STAGING_SCHEMA_VERSION!==32||STAGING_SCHEMA_BRIDGE_VERSION!==28||STAGING_SERVED_SCHEMA_VERSIONS.join()!=="28,29,30,31,32")throw new Error("Incorrect image schema bridge");
            // BF-18: hosted staging is at schema 31 when this image deploys (0032 is applied by hand afterwards). The receipt check of the image
            // accepts exactly the 31-migration prefix for the existing project (and 32), and a new project only at 32.
            const {EXISTING_PROJECT_REF}=await import("/app/packages/neuvetra-database/src/staging-audit.ts");
            const receipts=manifest.map(({name,sha256})=>({name,sha256})),existingProject={expectedProjectRef:EXISTING_PROJECT_REF,reuseExistingProject:true};
            if(validateHostedSchemaReceipts(receipts.slice(0,31),receipts,existingProject)!==31||validateHostedSchemaReceipts(receipts,receipts,existingProject)!==32)throw new Error("Image refuses the live schema");
            let refused=false;try{validateHostedSchemaReceipts(receipts.slice(0,31),receipts,{expectedProjectRef:"abcdefghijklmnopqrst"})}catch{refused=true}if(!refused)throw new Error("Image serves a new project below 32");
            // The HTTP listener starts and reports ready for the existing project at schema 31 (staging today) and for a new project at 32.
            const start=async(ref,schemaVersion)=>{
              const config=readStagingConfig({NODE_ENV:"test",NEUVETRA_STAGING_ENABLED:"enabled",NEUVETRA_STAGING_PROFILE:STAGING_PROFILE,NEUVETRA_STAGING_PROJECT_REF:ref,NEUVETRA_STAGING_ORIGIN:"http://127.0.0.1:8080",SUPABASE_URL:`https://${ref}.supabase.co`,SUPABASE_ANON_KEY:"sb_publishable_synthetic_fixture_not_a_real_key",DATABASE_URL:`postgres://neuvetra_runtime:fixture@db.${ref}.supabase.co:5432/postgres`,...(ref===EXISTING_PROJECT_REF?{NEUVETRA_STAGING_REUSE_EXISTING:"confirmed"}:{})});
              const database={checkReadiness:async()=>({profile:STAGING_PROFILE,schemaVersion,...(ref===EXISTING_PROJECT_REF?{legacyContainmentVerified:true}:{})}),close:async()=>{}};
              const app=await createStagingServer(config,{database,validateUser:async()=>null,log:()=>{}});
              const ready=await app.fetch(new Request("http://127.0.0.1:8080/ready"));const body=await ready.json();
              if(ready.status!==200||body.schemaVersion!==schemaVersion)throw new Error(`Image not ready at schema ${schemaVersion}`);
              return app;
            };
            await (await start(EXISTING_PROJECT_REF,31)).close();
            const app=await start("abcdefghijklmnopqrst",32);
            const server=Bun.serve({hostname:"127.0.0.1",port:8080,fetch:app.fetch});
            try {
              for(const route of ["/health","/ready","/","/workspace-api/config"]) {const r=await fetch(`http://127.0.0.1:8080${route}`);if(r.status!==200||r.headers.get("cache-control")!=="no-store")throw new Error("Image HTTP smoke failed");await r.arrayBuffer();}
              const index=await (await fetch("http://127.0.0.1:8080/")).text();
              const scripts=[...index.matchAll(/src="([^"]+\.js)"/g)].map(m=>m[1]);
              if(scripts.length===0)throw new Error("No built staging application");
              for(const src of scripts){if(!src.startsWith("/assets/"))throw new Error("External application script");const r=await fetch(`http://127.0.0.1:8080${src}`);if(r.status!==200)throw new Error("Missing staged bundle");await r.arrayBuffer();}
              for(const route of ["/.env","/apps/site-api/src/staging/server.ts","/tools/research/m43-heldout-first-batch-v1.json"])if((await fetch(`http://127.0.0.1:8080${route}`)).status!==404)throw new Error("Non-public path exposed");
              if((await fetch("http://127.0.0.1:8080/workspace-api/session")).status!==401)throw new Error("Authentication boundary failed");
              const uuid="11111111-1111-4111-8111-111111111111";
              if((await fetch(`http://127.0.0.1:8080/workspace-api/workspace/${uuid}/scope1-inventory`)).status!==401)throw new Error("Scope 1 image authentication boundary failed");
              if((await fetch(`http://127.0.0.1:8080/workspace-api/workspace/${uuid}/results/scope3`)).status!==401)throw new Error("Scope 3 results image authentication boundary failed");
              const binding={company_id:uuid,evidence_id:uuid,bill_version_id:uuid,activity_version_id:uuid,facility_id:uuid,boundary_id:uuid,bill_version:2,activity_version:1,extraction_id:uuid,parser_version:"m55-fixed-pdf-v1",previous_bill_version_id:uuid,evidence_sha256:"0a97cd0976c03af0776214fc19bdc3d4f0c00e9c835f3e116574a6f375c8e135",source_quantity_kwh:"12346.000",normalized_quantity_mwh:"12.346000",correction_reason:"Synthetic review exercise",service_period:{start:"2023-01-01",end:"2023-01-31"},facility:{name:"Synthetic California office",country:"United States",state:"California",egrid_subregion:"CAMX"},boundary:{reporting_year:2023,approach:"operational_control",status:"draft",version:1}};
              const calculation=await runEngine({action:"calculate_linked_bill",binding});
              if(calculation.status!=="ok"||calculation.record?.total?.unrounded!=="2407.9674055248")throw new Error("Container Decimal calculation failed");
              const {createM73Authority}=await import("/app/apps/site-api/src/calculation/m73-authority.ts");
              const gas=await createM73Authority().calculate({binding:{coverageVersionId:uuid,coverageVersionSha256:"a".repeat(64),entityId:uuid,facilityId:uuid,sourceId:uuid,boundaryDecisionId:uuid},period:{start:"2025-01-01",endExclusive:"2026-01-01"},fuel:"Natural Gas",heatBasis:"HHV",unit:"MMBtu",quantityMmbtu:"0.100",statementSha256:"b".repeat(64)});
              if(gas.total.unrounded!=="5.31145"||gas.total.display!=="5.3114"||gas.method.releaseEligible!==false)throw new Error("Container stationary gas Decimal calculation failed");
              const {createM74Authority}=await import("/app/apps/site-api/src/calculation/m74-authority.ts");
              const mobile=await createM74Authority().calculate({binding:{coverageVersionId:uuid,coverageVersionSha256:"a".repeat(64),entityId:uuid,facilityId:uuid,sourceId:uuid,boundaryDecisionId:uuid},period:{start:"2025-01-01",endExclusive:"2026-01-01"},vehicle:{assetId:"SYN-TRUCK-001",vehicleClass:"Medium- and Heavy-Duty Vehicles",classificationBasis:"Synthetic owned heavy-duty on-road truck controlled throughout 2025.",modelYear:2018,fuel:"Fossil Diesel",controlBasis:"owned_operational_control_full_year"},quantityGallons:"1000.125",quantityUnit:"US_gallon",distanceMiles:"12000.500",distanceUnit:"vehicle_mile",fuelStatementSha256:"b".repeat(64),mileageStatementSha256:"c".repeat(64)});
              if(mobile.total.unrounded!=="10351.53209375"||mobile.total.display!=="10351.5321"||mobile.method.releaseEligible!==false)throw new Error("Container mobile diesel Decimal calculation failed");
              const {createM76DieselAuthority}=await import("/app/apps/site-api/src/calculation/m76-authority.ts");
              const generator=await createM76DieselAuthority().calculate({binding:{coverageVersionId:uuid,coverageVersionSha256:"a".repeat(64),entityId:uuid,facilityId:uuid,sourceId:uuid,boundaryDecisionId:uuid},period:{start:"2025-01-01",endExclusive:"2026-01-01"},equipment:{assetId:"SYN-GEN-001",identifierBasis:"Fictional generator serial",equipmentType:"stationary_emergency_generator",engineType:"compression_ignition",stationaryInstallation:"fixed",controlBasis:"owned_operational_control_full_year",controlExplanation:"Fictional full year ownership and operational control",fuel:"Fossil Distillate Fuel Oil No. 2",fossilFraction:"1.000",fuelGradeBasis:"Fictional fuel grade and composition evidence"},unit:"US_gallon",quantityGallons:"25.000",statementSha256:"b".repeat(64)});
              if(generator.total.unrounded!=="256.00035"||generator.total.display!=="256.0004"||generator.method.releaseEligible!==false)throw new Error("Container generator Decimal calculation failed");
              const {createScope3Engine}=await import("/app/apps/site-api/src/calculation/scope3-authority.ts");
              const {REVIEWED_SCOPE3_ENGINE_SHA256}=await import("/app/apps/site-api/src/workspace/scope3-results-routes.ts");
              const waste=await createScope3Engine({expectedEngineSha256:REVIEWED_SCOPE3_ENGINE_SHA256}).calculate({kind:"waste",input:{period:{start:"2025-01-01",endExclusive:"2026-01-01"},category:5,material:"asphalt_concrete",treatment:"recycled",quantity:"17.125",unit:"metric_ton"}});
              if(waste.total?.unrounded!=="66.457491045171486235096879692"||waste.engineSha256!==REVIEWED_SCOPE3_ENGINE_SHA256)throw new Error("Container Scope 3 Decimal calculation failed");
              console.info(JSON.stringify({imageSmoke:"passed",database:"injected_offline",authentication:"refusal_only",calculation:"real_python",assets:"hash_verified"}));
            } finally {await server.stop(true);await app.close();}
          '
      - name: Verify pinned fugitive authority inside the offline image
        run: docker run --rm --network none --entrypoint bun neuvetra-m63:${{ github.sha }} tools/staging/m77-image-smoke.ts
      - name: Refuse ordinary container startup without explicit staging configuration
        run: |
          if docker run --rm --network none neuvetra-m63:${{ github.sha }}; then
            echo "Container unexpectedly started without staging configuration"
            exit 1
          fi
      - name: Record exact local image identity
        run: docker image inspect neuvetra-m63:${{ github.sha }} --format '{{.Id}}'

  research-catalog:
    name: Offline research catalog tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/research -p "test_*.py" -v
      - name: Offline cloud evidence boundary tests
        run: python -B -m unittest discover -s tools/cloud -p "test_*.py" -v

  ghg-calculations:
    name: GHG calculation specifications and engine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pint==0.26 pytest==9.1.1 pyyaml==6.0.3
      - name: Verify Scope 1, 2 and 3 Python engines
        working-directory: apps/site-api/src/calculation
        # Round 2 (ENG-5): every *_test.py module, so no engine test can be left out of CI (the R2 rebuild runs on the committed CSV).
        run: python -m unittest discover -p '*_test.py' -v
      - run: bun run test:ghg
      - name: Verify offline fugitive candidate and independent accounting cases
        run: |
          python -m unittest discover -s apps/site-api/src/calculation -p m77_fugitive_test.py -v
          python evaluations/research-qa/m77-independent-calculation.py
      - name: Independently verify Scope 1 candidate accounting
        run: |
          python evaluations/research-qa/m78-independent-rational-oracle.py
          python evaluations/research-qa/m78-author-expectations-challenge.py

  migration-guard:
    name: Hosted migration deploy guard
    # Releases are PR + green CI + one QA review, and Railway deploys main automatically (with "Wait for CI"). Migrations are
    # never applied at boot: the staging image refuses to start unless the live database is at a schema it serves, i.e. a version
    # from STAGING_SCHEMA_BRIDGE_VERSION up to STAGING_SCHEMA_VERSION (STAGING_SERVED_SCHEMA_VERSIONS in
    # packages/neuvetra-database/src/hosted.ts). So a change to migrations may only land while the image it ships still serves
    # the schema that is live today. Pure diff-plus-source check: no labels, no API calls, no extra token scopes.
    # It runs on pull requests AND on pushes to main (never skipped on a push, so Railway's "Wait for CI" sees a real result).
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # THE LIVE HOSTED STAGING SCHEMA. Bump this number in the same PR as, or right after, the hosted migration is
      # actually applied by hand through tools/staging (never before). Until it is bumped, no merged build may raise
      # STAGING_SCHEMA_BRIDGE_VERSION above it, because the deploy of that build would fail /ready and block every later deploy.
      # Must be a positive integer; the guard fails closed otherwise.
      LIVE_STAGING_SCHEMA: '31'
      EVENT_NAME: ${{ github.event_name }}
      PUSH_BEFORE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request: the checkout is a merge commit, HEAD^1 is the base branch tip, so `git diff HEAD^1 HEAD` is exactly this PR's change.
          # push: full history, so github.event.before (the previous tip of main) can be found for `git diff before HEAD`.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Keep the image able to start against the live schema
        shell: bash
        run: |
          set -euo pipefail
          hosted=packages/neuvetra-database/src/hosted.ts
          migrations=packages/neuvetra-database/src/migrations/
          live="$LIVE_STAGING_SCHEMA"
          errors=()

          # Fail closed on a malformed live schema (a value such as `thirty` used to make every numeric test error inside `if` and pass).
          if ! [[ "$live" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=Migration guard::LIVE_STAGING_SCHEMA must be a positive integer (digits only, no leading zero), but it is '${live}'. Fix the env value of the migration-guard job in .github/workflows/verify.yml."
            exit 1
          fi

          # Read the real constants. hosted.ts cannot be imported here (it needs pg and the workspace install) and its text is
          # never evaluated: each of the three `export const` statements must match one exact form, and the served set is computed
          # here from the captured integers. Any other form fails closed; whoever changes hosted.ts must update this guard with it.
          evaluator="$RUNNER_TEMP/read-hosted-constants.mjs"
          cat > "$evaluator" <<'JS'
          const fail = (message) => { console.error(message); process.exit(1) }
          const source = await Bun.file(process.argv[2]).text()
          const statement = (name) => {
            const found = source.match(new RegExp(`^export const ${name}\\b.*$`, "gm")) ?? []
            if (found.length !== 1) fail(`expected exactly one single-line 'export const ${name}' statement, found ${found.length}`)
            return found[0].trimEnd()
          }
          const integer = (name) => {
            const m = statement(name).match(new RegExp(`^export const ${name}(?:: number)? = ([1-9][0-9]{0,5})$`))
            if (!m) fail(`${name} must be a plain positive integer literal (export const ${name} = 30). The guard only understands that exact form; update the guard in .github/workflows/verify.yml together with hosted.ts.`)
            return Number(m[1])
          }
          const schema = integer("STAGING_SCHEMA_VERSION")
          const bridge = integer("STAGING_SCHEMA_BRIDGE_VERSION")
          const servedLine = statement("STAGING_SERVED_SCHEMA_VERSIONS")
          const derivedForm = "export const STAGING_SERVED_SCHEMA_VERSIONS: readonly number[] = Array.from({ length: STAGING_SCHEMA_VERSION - STAGING_SCHEMA_BRIDGE_VERSION + 1 }, (_, i) => STAGING_SCHEMA_BRIDGE_VERSION + i)"
          let served
          if (servedLine === derivedForm) {
            served = Array.from({ length: schema - bridge + 1 }, (_, i) => bridge + i)
          } else {
            const m = servedLine.match(/^export const STAGING_SERVED_SCHEMA_VERSIONS(?:: readonly number\[\])? = \[ ?([0-9]+(?:, ?[0-9]+)*) ?\]$/)
            if (!m) fail("STAGING_SERVED_SCHEMA_VERSIONS is in neither form the guard understands (the Array.from(...) derivation from the bridge and schema, or a plain list of integers). Update the guard in .github/workflows/verify.yml together with hosted.ts.")
            served = m[1].split(",").map((n) => Number(n.trim()))
          }
          if (schema < bridge) fail(`schema ${schema} is below bridge ${bridge}`)
          if (served.length === 0 || !served.every((n) => Number.isSafeInteger(n) && n > 0)) fail("the served set is not a non-empty list of positive integers")
          console.log(JSON.stringify({ schema, bridge, served }))
          JS

          # Read hosted.ts at a revision ("WORKTREE" = this checkout) into "schema bridge served" (served comma separated). Fails closed.
          read_consts() {
            local rev="$1" copy json
            copy="$RUNNER_TEMP/hosted-$(printf '%s' "$rev" | tr -c 'A-Za-z0-9' _).ts"
            if [ "$rev" = WORKTREE ]; then cp "$hosted" "$copy"; else git show "$rev:$hosted" > "$copy"; fi
            if ! json="$(bun "$evaluator" "$copy" 2>"$RUNNER_TEMP/eval.err")"; then
              echo "::error file=$hosted,title=Migration guard::Could not read the staging schema constants at ${rev}: $(tr '\n' ' ' < "$RUNNER_TEMP/eval.err"). If hosted.ts changed how it defines them, update this guard (.github/workflows/verify.yml, job migration-guard)." >&2
              exit 1
            fi
            bun -e 'const v = JSON.parse(process.argv[1]); console.log(`${v.schema} ${v.bridge} ${v.served.join(",")}`)' "$json"
          }

          # Choose what to diff against.
          full_check=false
          if [ "$EVENT_NAME" = pull_request ]; then
            if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -ne 3 ]; then
              echo "::error title=Migration guard::Expected the pull request merge commit (two parents); cannot find the base to diff against."
              exit 1
            fi
            base="$(git rev-parse HEAD^1)"
          elif [ "$EVENT_NAME" = push ]; then
            if [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
              # All-zero before SHA: the ref was just created, so there is no previous tip to diff. Fall back to a full check
              # (constants against the live schema, plus the migrations folder being exactly 0001..schema). The immutability of
              # applied files cannot be diffed here; it stays covered by the receipt hash check in the image and its unit tests.
              full_check=true
              base=""
            elif [[ ! "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
              # Before SHA that is malformed or not in the repository (for example the old tip was force-pushed away): what changed
              # cannot be established, so fail closed rather than guess. A maintainer must look at the push and re-run it.
              echo "::error title=Migration guard::The previous tip of main (${PUSH_BEFORE_SHA}) is not available, so this push cannot be diffed. Failing closed; check the push by hand and re-run the job."
              exit 1
            else
              base="$PUSH_BEFORE_SHA"
            fi
          else
            echo "::error title=Migration guard::Unsupported event '${EVENT_NAME}'."
            exit 1
          fi

          # (assign first: `exit` inside a command substitution only fails the assignment, which `set -e` then honours)
          here="$(read_consts WORKTREE)"
          read -r schema bridge served <<< "$here"
          if [ "$full_check" = true ]; then
            base_schema="n/a"; base_bridge="n/a"
            changes=""
            constants_changed=false
          else
            there="$(read_consts "$base")"
            read -r base_schema base_bridge _ <<< "$there"
            # Name-status without rename detection: a rename shows as a delete plus an add.
            changes="$(git diff --name-status --no-renames "$base" HEAD -- "$migrations")"
            constants_changed=false
            if [ "$schema" != "$base_schema" ] || [ "$bridge" != "$base_bridge" ]; then constants_changed=true; fi
          fi

          echo "Event: $EVENT_NAME  (diff base: ${base:-none, full check})"
          echo "Live staging schema (LIVE_STAGING_SCHEMA): $live"
          echo "hosted.ts here:        STAGING_SCHEMA_VERSION=$schema  STAGING_SCHEMA_BRIDGE_VERSION=$bridge  STAGING_SERVED_SCHEMA_VERSIONS=[$served]"
          echo "hosted.ts on the base: STAGING_SCHEMA_VERSION=$base_schema  STAGING_SCHEMA_BRIDGE_VERSION=$base_bridge"

          # Rule 1, every run: the image this change would deploy must serve the live schema.
          if [ "$bridge" -gt "$live" ]; then
            errors+=("STAGING_SCHEMA_BRIDGE_VERSION is $bridge but the live staging schema is $live. The image would serve only $bridge..$schema and would fail /ready against the live database; Railway would keep the old deploy and block every later deploy. Keep the bridge at or below $live in this change, merge, apply the hosted migration by hand, then raise the bridge and LIVE_STAGING_SCHEMA in a follow-up PR.")
          fi
          if [ "$schema" -lt "$live" ]; then
            errors+=("STAGING_SCHEMA_VERSION is $schema, below the live staging schema $live. The image would refuse to start against the live database.")
          fi
          # Rule 3, every run: the served set (what the readiness check actually uses) must contain the live schema.
          if ! printf ',%s,' "$served" | grep -q ",${live},"; then
            errors+=("STAGING_SERVED_SCHEMA_VERSIONS is [$served], which does not include the live staging schema $live. The image would fail /ready against the live database and block every later deploy.")
          fi

          # Rule 2: migrations already applied to the live database are immutable (the image checks receipts against file hashes).
          applied_touched=false
          new_migrations=false
          if [ -n "$changes" ]; then
            while IFS=$'\t' read -r status file; do
              name="$(basename "$file")"
              number="$(printf '%s' "$name" | sed -nE 's/^([0-9]{4})_.*\.sql$/\1/p')"
              if [ -z "$number" ]; then
                errors+=("$status $file: not a NNNN_name.sql migration file. Nothing else belongs in the migrations folder.")
              elif [ "$((10#$number))" -le "$live" ]; then
                applied_touched=true
                errors+=("$status $file: migration $number is at or below the live schema $live, so it is already applied. Applied migrations are immutable (changing, deleting or inserting one breaks the receipt hash check and the deploy cannot start). Fix forward with a new migration numbered above $live.")
              else
                new_migrations=true
              fi
            done <<< "$changes"
          fi

          # Full check only (no base to diff): the folder must be exactly 0001..schema, each file named NNNN_name.sql.
          if [ "$full_check" = true ]; then
            numbers="$(ls "$migrations" | sed -nE 's/^([0-9]{4})_.*\.sql$/\1/p' | sed 's/^0*//' | sort -n | tr '\n' ' ')"
            expected="$(seq 1 "$schema" | tr '\n' ' ')"
            if [ "$(ls "$migrations" | wc -l)" -ne "$schema" ] || [ "$numbers" != "$expected" ]; then
              errors+=("Full check (no previous tip to diff): the migrations folder must hold exactly the files 0001..$(printf '%04d' "$schema") named NNNN_name.sql.")
            fi
          fi

          {
            echo "### Hosted migration guard"
            echo "| | |"
            echo "|---|---|"
            echo "| Event | $EVENT_NAME$([ "$full_check" = true ] && echo ' (full check, no previous tip)') |"
            echo "| Live staging schema | $live |"
            echo "| Image would serve | $bridge..$schema (served set: $served) |"
            if [ "${#errors[@]}" -gt 0 ]; then
              echo "| Result | FAILED |"
            elif [ "$new_migrations" = true ]; then
              echo "| Result | migration change is safe to deploy first (bridge $bridge <= live $live); apply the new migration by hand after the deploy |"
            elif [ -n "$changes" ] || [ "$constants_changed" = true ]; then
              echo "| Result | only schema constants changed; the image still serves live schema $live; nothing to apply |"
            elif [ "$full_check" = true ]; then
              echo "| Result | full check passed |"
            else
              echo "| Result | no migration change |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${#errors[@]}" -gt 0 ]; then
            for e in "${errors[@]}"; do echo "::error title=Migration guard::$e"; done
            exit 1
          fi
          if [ "$new_migrations" = true ]; then
            echo "Migration guard: migration change is deployable against live schema $live (bridge $bridge <= $live <= schema $schema). Deploy this first, then apply the new hosted migration by hand."
          elif [ -n "$changes" ] || [ "$constants_changed" = true ]; then
            echo "Migration guard: only schema constants changed; the image still serves live schema $live. Nothing to apply."
          elif [ "$full_check" = true ]; then
            echo "Migration guard: full check passed (no previous tip to diff)."
          else
            echo "Migration guard: no migration change."
          fi

  browser-smoke:
    # E2E-01: one browser smoke suite for site-web (apps/site-web/e2e/README.md). The real staging server serves the built
    # staging bundle against a PostgreSQL 17 database migrated by the repository's own helper and seeded with fixed synthetic
    # data; Supabase is stubbed in the browser and the token validator is injected, so nothing hosted is contacted.
    # E2E-02: PostgreSQL runs on the runner's own loopback (host network), so the harness can check that the server it
    # resets is local and dedicated; Chrome is the Chrome for Testing build pinned by playwright-core; a run that passes
    # fewer journeys than expected (or none, if the database variable went missing) fails.
    name: Browser smoke (site-web end to end)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_DATABASE_URL: postgres://e2e_admin@127.0.0.1:55480/neuvetra_e2e
      # The journeys in apps/site-web/e2e/browser-smoke.test.ts; raise it with every journey added.
      E2E_EXPECTED_PASS: "25"
      # playwright-core 1.59.1 drives Chrome for Testing 147.0.7727.15 (its browsers.json, chromium revision 1217).
      E2E_CHROME_VERSION: "147.0.7727.15"
    steps:
      - name: Start a dedicated PostgreSQL 17 on the runner's loopback
        run: |
          docker run --detach --name e2e-postgres --network host -e POSTGRES_USER=e2e_admin -e POSTGRES_DB=postgres -e POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:17 -c listen_addresses=127.0.0.1 -c port=55480
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      # The Scope 1, 2 and 3 engines behind Results run as Python (standard library only).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - name: Check that playwright-core still pins the expected Chrome for Testing
        working-directory: apps/site-web
        run: |
          dir=$(bun -e 'console.log(require("node:path").dirname(require.resolve("playwright-core")))')
          pinned=$(bun -e 'const b = require(process.argv[1] + "/browsers.json"); console.log(b.browsers.find(x => x.name === "chromium").browserVersion)' "$dir")
          echo "playwright-core pins Chrome for Testing $pinned"
          if [ "$pinned" != "$E2E_CHROME_VERSION" ]; then echo "::error title=Browser smoke::playwright-core now pins Chrome $pinned; update E2E_CHROME_VERSION and the cache key together."; exit 1; fi
      # Downloaded from the official Chrome for Testing bucket rather than with Playwright's installer, which refuses
      # host images it does not know yet (it rejected ubuntu-26.04).
      - name: Restore the pinned Chrome for Testing
        id: chrome-cache
        uses: actions/cache@v4
        with:
          path: ~/chrome-for-testing/${{ env.E2E_CHROME_VERSION }}
          key: chrome-for-testing-${{ env.E2E_CHROME_VERSION }}-${{ runner.os }}-linux64
      - name: Install the pinned Chrome for Testing
        if: steps.chrome-cache.outputs.cache-hit != 'true'
        run: |
          dir="$HOME/chrome-for-testing/$E2E_CHROME_VERSION"
          mkdir -p "$dir"
          curl --fail --show-error --silent --location --retry 3 --output "$RUNNER_TEMP/chrome.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/$E2E_CHROME_VERSION/linux64/chrome-linux64.zip"
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$dir"
      - name: Use the pinned Chrome
        run: |
          chrome="$HOME/chrome-for-testing/$E2E_CHROME_VERSION/chrome-linux64/chrome"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version
      - name: Build the site-web staging bundle
        working-directory: apps/site-web
        run: bun run build:staging
      - name: Typecheck the browser smoke suite
        working-directory: apps/site-web
        run: bun ../../node_modules/typescript/bin/tsc --noEmit --module esnext --moduleResolution bundler --target es2022 --types bun --strict --skipLibCheck --lib es2022,dom,dom.iterable e2e/browser-smoke.test.ts
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do docker exec e2e-postgres pg_isready -h 127.0.0.1 -p 55480 -U e2e_admin -d postgres && exit 0; sleep 1; done
          docker logs e2e-postgres; exit 1
      - name: Run the browser smoke suite
        working-directory: apps/site-web
        run: |
          set -o pipefail
          bun run test:e2e 2>&1 | tee "$RUNNER_TEMP/browser-smoke.log"
          passed=$(grep -oE '^ *[0-9]+ pass$' "$RUNNER_TEMP/browser-smoke.log" | grep -oE '[0-9]+' | tail -1)
          echo "Journeys passed: ${passed:-0} of $E2E_EXPECTED_PASS expected"
          if [ "${passed:-0}" -lt "$E2E_EXPECTED_PASS" ]; then echo "::error title=Browser smoke::only ${passed:-0} journeys passed; $E2E_EXPECTED_PASS expected (were tests skipped?)"; exit 1; fi
      - name: Keep screenshots and traces of failed journeys
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failures
          path: apps/site-web/test-results/browser-smoke/
          if-no-files-found: ignore
          retention-days: 14
