name: Agent operating records

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/roadmap-neuvetra-ghg.md'
      - 'docs/research/carb-verifier-role-*'
      - 'operations/agents/**'
      - 'operations/agent-improvement/**'
      - 'tools/agent_ops.py'
      - 'tools/test_agent_ops.py'
      - 'tools/agent_workflow.py'
      - 'tools/test_agent_workflow.py'
      - 'tools/feature_metrics.py'
      - 'tools/test_feature_metrics.py'
      - 'tools/build_model_pilot.py'
      - 'tools/test_build_model_pilot.py'
      - '.github/workflows/agent-ops.yml'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/roadmap-neuvetra-ghg.md'
      - 'docs/research/carb-verifier-role-*'
      - 'operations/agents/**'
      - 'operations/agent-improvement/**'
      - 'tools/agent_ops.py'
      - 'tools/test_agent_ops.py'
      - 'tools/agent_workflow.py'
      - 'tools/test_agent_workflow.py'
      - 'tools/feature_metrics.py'
      - 'tools/test_feature_metrics.py'
      - 'tools/build_model_pilot.py'
      - 'tools/test_build_model_pilot.py'
      - '.github/workflows/agent-ops.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-records:
    name: Role routing and evidence records
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Challenge evidence and routing validation
        run: python -B -m unittest discover -s tools -p test_agent_ops.py -v
      - name: Validate feature metrics and capped model pilot tooling
        run: |
          python -B -m unittest discover -s tools -p test_feature_metrics.py -v
          python -B -m unittest discover -s tools -p test_build_model_pilot.py -v
      - name: Challenge bounded workflow controller
        # This controller never dispatches agents or contacts providers in CI.
        run: python -B -m unittest discover -s tools -p test_agent_workflow.py -v
      - name: Validate current role records and evidence
        run: python -B tools/agent_ops.py validate
      - name: Validate recorded feature and pilot evidence
        run: python -B tools/feature_metrics.py validate --registry operations/agent-improvement/build-feature-registry.json --feature-events operations/agent-improvement/build-feature-events-v1.jsonl --usage-events operations/agent-improvement/build-usage-events.jsonl --runs-dir operations/agent-improvement/runs
